# Checks every push and pull request: types, tests, styles, builds.
# A red mark here means: don't deploy this commit.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-showcase/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digital-showcase/backend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc -p tsconfig.json --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-showcase/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digital-showcase/frontend/package-lock.json
      - run: npm ci
      - name: Styles
        run: npm run lint:css
      - name: Types and build
        run: npm run build

  # The images the server runs: catches a broken Dockerfile or a native
  # module (better-sqlite3, sharp) that doesn't install on Linux.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Backend image
        run: docker build -t showcase-backend digital-showcase/backend
      - name: Backend image starts and answers
        run: |
          docker run -d --name backend -p 4000:4000 \
            -e NODE_ENV=production \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL=admin@ci.local \
            -e ADMIN_PASSWORD="$(openssl rand -hex 12)" \
            -e DATABASE_URL=file:/app/data/database.sqlite \
            -e BACKUP_ENABLED=false \
            showcase-backend
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs backend
          exit 1
      - name: Frontend image
        run: docker build -t showcase-frontend digital-showcase/frontend
      - name: Nginx image
        run: docker build -t showcase-nginx digital-showcase/nginx
      - name: Compose file is valid
        working-directory: digital-showcase
        run: |
          cp .env.example .env
          docker compose config --quiet
