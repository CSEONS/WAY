services:
  backend:
    build: ./backend
    user: root
    command: sh -c "chown -R node:node /app/data /app/uploads && npm start"
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATABASE_URL: file:/app/data/database.sqlite
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-120000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      AI_MONTHLY_LIMIT: ${AI_MONTHLY_LIMIT:-100}
      AI_RUB_PER_1M_INPUT_TOKENS: ${AI_RUB_PER_1M_INPUT_TOKENS:-}
      AI_RUB_PER_1M_OUTPUT_TOKENS: ${AI_RUB_PER_1M_OUTPUT_TOKENS:-}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_TELEGRAM: ${SUPPORT_TELEGRAM:-}
      IMAGE_UPLOAD_MAX_BYTES: ${IMAGE_UPLOAD_MAX_BYTES:-15728640}
      AI_IMAGE_MAX_DIMENSION: ${AI_IMAGE_MAX_DIMENSION:-512}
      AI_IMAGE_QUALITY: ${AI_IMAGE_QUALITY:-72}
      PRODUCT_IMAGE_MAX_DIMENSION: ${PRODUCT_IMAGE_MAX_DIMENSION:-2048}
      PRODUCT_IMAGE_QUALITY: ${PRODUCT_IMAGE_QUALITY:-86}
      PRODUCT_IMAGE_MAX_BYTES: ${PRODUCT_IMAGE_MAX_BYTES:-10485760}
    restart: unless-stopped
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    build: ./nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN:-localhost}
      LE_DOMAIN: ${LE_DOMAIN:-}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-locations.conf:/etc/nginx/proxy-locations.conf:ro
      - ./nginx/paid-cert:/etc/nginx/paid-cert:ro
      - nginx_certs:/etc/nginx/ssl
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  backend_data:
  backend_uploads:
  nginx_certs:
  certbot_conf:
  certbot_www:
