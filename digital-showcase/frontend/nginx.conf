server {
  listen 80;
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;

  # Только свои скрипты, стили, шрифты и запросы: внедрённый чужой скрипт не
  # запустится и не отправит данные наружу. data:/blob: — QR-коды, превью фото
  # и голосовые записи. Действует на страницы приложения (location / ниже);
  # у location со своими add_header этот заголовок не наследуется — там статика.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # Манифест и иконки приложения (PWA) — имена без хеша, поэтому кешируем
  # коротко: новая иконка дойдёт до телефонов за день.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location ^~ /icons/ {
    expires 1d;
    access_log off;
  }

  # Кешируем статические файлы с хешами в имени
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Перенаправляем все неизвестные маршруты на index.html для SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
