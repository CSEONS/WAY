server {
  listen 80;
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;

  # Манифест и иконки приложения (PWA) — имена без хеша, поэтому кешируем
  # коротко: новая иконка дойдёт до телефонов за день.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location ^~ /icons/ {
    expires 1d;
    access_log off;
  }

  # Кешируем статические файлы с хешами в имени
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Перенаправляем все неизвестные маршруты на index.html для SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
