server {
  listen 80;
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;

  # Кешируем статические файлы с хешами в имени
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Перенаправляем все неизвестные маршруты на index.html для SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
