server {
  listen 80;
  server_name _;
  client_max_body_size 620m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Let's Encrypt HTTP-01 challenge files (written by the certbot service).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/proxy-locations.conf;
}

server {
  # Fallback for direct-IP access (no SNI match / no domain) and for
  # requests before a domain is set up at all.
  listen 443 ssl default_server;
  server_name _;
  client_max_body_size 620m;

  # Self-signed cert, generated automatically on container start by
  # docker-entrypoint-ssl.sh (see nginx/Dockerfile).
  ssl_certificate     /etc/nginx/ssl/self-signed.crt;
  ssl_certificate_key /etc/nginx/ssl/self-signed.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  include /etc/nginx/proxy-locations.conf;
}

server {
  # Real domain, purchased (GlobalSign via Timeweb) certificate.
  #
  # Cert + key are placed manually at nginx/paid-cert/ on the server (see
  # nginx/paid-cert/.gitkeep) — gitignored, never committed. Renews
  # annually through Timeweb; when you renew, just replace those two files
  # and reload nginx.
  #
  # www.waytuk.ru isn't listed here yet — only add it once its own DNS A
  # record exists and the certificate covers it too.
  listen 443 ssl;
  server_name waytuk.ru;
  client_max_body_size 620m;

  ssl_certificate     /etc/nginx/paid-cert/waytuk.ru.crt;
  ssl_certificate_key /etc/nginx/paid-cert/waytuk.ru.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  include /etc/nginx/proxy-locations.conf;
}

# The Let's Encrypt setup (certbot service + docker-entrypoint-ssl.sh's
# dummy-cert seeding for LE_DOMAIN) is left in place but dormant — unset
# LE_DOMAIN in .env and it does nothing. It's a ready fallback: point this
# server block's ssl_certificate lines back at
# /etc/letsencrypt/live/waytuk.ru/{fullchain,privkey}.pem and set LE_DOMAIN
# again if you ever want to go back to auto-renewing for free.
