# Docker's embedded DNS — needed because proxy_pass below uses a variable
# ($m_upstream), which nginx resolves at request time instead of once at
# startup.
resolver 127.0.0.11 valid=30s;

# Route known link-preview crawlers (WhatsApp, Telegram, Facebook, etc.) on
# /m/... to the backend's server-rendered OG-tag shell (ogController.ts);
# everyone else goes straight to the frontend SPA, unchanged.
map $http_user_agent $m_upstream {
  default "frontend:80";
  "~*facebookexternalhit|Twitterbot|WhatsApp|TelegramBot|Slackbot|LinkedInBot|Discordbot|vkShare|Viber|SkypeUriPreview|Google-InspectionTool|Pinterest|redditbot|Applebot" "backend:4000";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 620m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Let's Encrypt HTTP-01 challenge files (written by the certbot service).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # Fallback for direct-IP access (no SNI match / no domain) and for
  # requests before a domain is set up at all.
  listen 443 ssl default_server;
  server_name _;
  client_max_body_size 620m;

  # Self-signed cert, generated automatically on container start by
  # docker-entrypoint-ssl.sh (see nginx/Dockerfile).
  ssl_certificate     /etc/nginx/ssl/self-signed.crt;
  ssl_certificate_key /etc/nginx/ssl/self-signed.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  include /etc/nginx/proxy-locations.conf;
}

server {
  # Real domain, purchased (GlobalSign via Timeweb) certificate.
  #
  # Cert + key are placed manually at nginx/paid-cert/ on the server (see
  # nginx/paid-cert/.gitkeep) — gitignored, never committed. Renews
  # annually through Timeweb; when you renew, just replace those two files
  # and reload nginx.
  #
  # www.waytuk.ru isn't listed here yet — only add it once its own DNS A
  # record exists and the certificate covers it too.
  listen 443 ssl;
  server_name waytuk.ru;
  client_max_body_size 620m;

  ssl_certificate     /etc/nginx/paid-cert/waytuk.ru.crt;
  ssl_certificate_key /etc/nginx/paid-cert/waytuk.ru.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=15768000" always;

  # Store/product links (/m/...) — bots get the OG-tag preview shell from
  # the backend, everyone else goes to the SPA. See the $m_upstream map.
  location /m/ {
    proxy_pass http://$m_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/proxy-locations.conf;
}

# The Let's Encrypt setup (certbot service + docker-entrypoint-ssl.sh's
# dummy-cert seeding for LE_DOMAIN) is left in place but dormant — unset
# LE_DOMAIN in .env and it does nothing. It's a ready fallback: point this
# server block's ssl_certificate lines back at
# /etc/letsencrypt/live/waytuk.ru/fullchain.pem and .../privkey.pem, and set
# LE_DOMAIN again if you ever want to go back to auto-renewing for free.
