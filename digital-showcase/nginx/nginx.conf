# Docker's embedded DNS — needed because proxy_pass below uses a variable
# ($m_upstream), which nginx resolves at request time instead of once at
# startup.
resolver 127.0.0.11 valid=30s;

# Route known link-preview crawlers (WhatsApp, Telegram, Facebook, etc.) on
# /m/... to the backend's server-rendered OG-tag shell (ogController.ts);
# everyone else goes straight to the frontend SPA, unchanged.
map $http_user_agent $m_upstream {
  default "frontend:80";
  "~*facebookexternalhit|Twitterbot|WhatsApp|TelegramBot|Slackbot|LinkedInBot|Discordbot|vkShare|Viber|SkypeUriPreview|Google-InspectionTool|Pinterest|redditbot|Applebot" "backend:4000";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 60m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Let's Encrypt HTTP-01 challenge files (written by the certbot service).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # Fallback for direct-IP access (no SNI match / no domain) and for
  # requests before a domain is set up at all.
  listen 443 ssl default_server;
  server_name _;
  client_max_body_size 60m;

  # Self-signed cert, generated automatically on container start by
  # docker-entrypoint-ssl.sh (see nginx/Dockerfile).
  ssl_certificate     /etc/nginx/ssl/self-signed.crt;
  ssl_certificate_key /etc/nginx/ssl/self-signed.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  include /etc/nginx/proxy-locations.conf;
}

# The site's own domain (SITE_DOMAIN) with its certificate is generated at
# container start from site.conf.template by docker-entrypoint-site.sh.
# Without a domain the server above answers everything (by IP, self-signed).
include /etc/nginx/site/*.conf;
