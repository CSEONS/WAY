# Upstreams go through variables, so nginx looks their addresses up on each
# request (the resolver in nginx.conf) instead of once at startup. A deploy
# recreates backend and frontend with new addresses; with names written into
# proxy_pass nginx kept the old ones and answered 502 to everything until
# `docker compose restart nginx`. A variable proxy_pass without a path passes
# the request URI as it came, which is the same path for every location here.
set $backend_upstream "backend:4000";
set $frontend_upstream "frontend:80";

# Store/product links (/m/...) — link-preview bots get the OG-tag shell from
# the backend, everyone else goes to the SPA. See the $m_upstream map.
location /m/ {
  proxy_pass http://$m_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
  proxy_pass http://$backend_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180s;
}

# Built by the backend from the live list of stores and products.
location = /sitemap.xml {
  proxy_pass http://$backend_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /robots.txt {
  proxy_pass http://$backend_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /uploads/ {
  proxy_pass http://$backend_upstream;
  proxy_set_header Host $host;
}

location / {
  proxy_pass http://$frontend_upstream;
  proxy_set_header Host $host;
}
